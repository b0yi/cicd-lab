name: CI Pipeline

on: push

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm run test -- --reporter=junit --outputFile=test-results.xml
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Vitest Tests
          path: test-results.xml
          reporter: java-junit
